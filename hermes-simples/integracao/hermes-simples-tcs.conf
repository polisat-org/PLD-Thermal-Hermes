# Drop-in do hermes-simples para rodar junto com o TCS no mesmo Pi Zero (1 núcleo).
# Instalar: sudo mkdir -p /etc/systemd/system/hermes-simples.service.d
#           sudo cp hermes-simples-tcs.conf /etc/systemd/system/hermes-simples.service.d/
#           sudo systemctl daemon-reload && sudo systemctl restart hermes-simples
[Service]
# O serviço roda como root: o caminho dos logs do TCS precisa ser explícito.
Environment=TCS_LOGS=/home/polisat/tcs/logs
# O dump1090 (filho deste serviço) é o maior consumidor de CPU; cede para o laço de 1 s do TCS.
Nice=5
